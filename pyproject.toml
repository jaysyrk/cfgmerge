[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgmerge"
version = "0.1.0"
description = "Universal, schema-free, semantic three-way merge for config files (git merge driver)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18", "tomlkit>=0.12", "lxml>=5"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
cfgmerge = "cfgmerge.cli:main"

[tool.setuptools.packages.find]
include = ["cfgmerge*"]

[project.urls]
Homepage = "https://github.com/jaysyrk/cfgmerge"
Issues = "https://github.com/jaysyrk/cfgmerge/issues"
